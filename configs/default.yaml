project:
  name: VisionGuard AI
  version: 0.1.0
dataset:
  root: data/mvtec_ad
  category: bottle
  normal_class: good
  calibration_fraction: 0.15
  calibration_seed: 42
preprocessing:
  input_size: [256, 256]
  preserve_aspect_ratio: true
model:
  architecture: resnet18
  feature_layers: [layer2, layer3]
  batch_size: 8
  max_memory_bank_patches: 10000
  sampling_strategy: random
  sampling_ratio: 0.1
  distance_metric: euclidean
  aggregation: max
  score_percentile: 99.5
  smoothing_sigma: 4.0
  mask_threshold: 0.5 # Legacy provisional value; calibration rules are defined below.
  device: auto
  random_seed: 42
thresholds:
  image_rule: mean_plus_3std
  pixel_rule: percentile
  image_percentile: 99.5
  pixel_percentile: 99.5
classical:
  blur_kernel_size: 3
  local_blur_kernel_size: 31
  min_region_area: 20
evaluation:
  pixel_metric_size: [256, 256]
  warmup_images: 3
  smoke_test_image_count: 5
  sweep_ratios: [0.01, 0.05, 0.10, 0.25, 1.0]
  sweep_candidate_pool_size: 2048
  failure_examples_per_method: 5
paths:
  artifacts: models
  outputs: outputs
logging:
  level: INFO
